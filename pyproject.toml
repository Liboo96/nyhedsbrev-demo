[project]
name = "newsletter-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "Pillow>=11,<13",
]

[project.scripts]
create-newsletter = "tools.create_newsletter:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
